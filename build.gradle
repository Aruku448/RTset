plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

def portableGameDirectory = new File(
    new File(System.getProperty('user.home'), '.minecraft'),
    'versions/RTest')
def configuredWindowsInstance = file('C:/Program Files (x86)/mc/DS2/.minecraft')
// Prefer the instance used by the local Windows launcher when it is present. All paths remain
// overridable with -Pgame_directory/-Pinstance_directory for other launchers and installations.
def defaultGameDirectory = configuredWindowsInstance.isDirectory()
        ? configuredWindowsInstance
        : portableGameDirectory

def configureVulkanEarlyWindow = { File gameDir ->
    def fmlConfig = new File(gameDir, 'config/fml.toml')
    fmlConfig.parentFile.mkdirs()
    def content = fmlConfig.exists() ? fmlConfig.getText('UTF-8') : ''
    if (content.readLines().any { it.trim().startsWith('earlyWindowControl') }) {
        content = content.replaceAll('(?m)^earlyWindowControl *=.*$', 'earlyWindowControl = false')
    } else {
        content += System.lineSeparator() + 'earlyWindowControl = false' + System.lineSeparator()
    }
    fmlConfig.setText(content, 'UTF-8')
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file(project.findProperty('game_directory') ?: defaultGameDirectory)
            if (project.findProperty('graphics_backend')) {
                programArguments.addAll '--graphicsBackend', project.findProperty('graphics_backend')
            }
            if (project.hasProperty('vulkan_validation')) {
                programArguments.add '--vulkanValidation'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file(project.findProperty('game_directory') ?: defaultGameDirectory)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file(project.findProperty('game_directory') ?: defaultGameDirectory)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
tasks.named('processResources') {
    from('third_party') {
        include 'PRIME-LICENSE.txt', 'PRIME-LICENSE-EXCEPTIONS.txt'
        into 'META-INF/licenses/rtest'
    }
    from('third_party/prime-atmosphere-26.3') {
        include 'LICENSE', 'LICENSE-EXCEPTIONS', 'SKY-TRACER-NOTICE.md', 'PROVENANCE.md'
        into 'META-INF/licenses/prime-atmosphere-26.3'
    }
    from('LICENSE') {
        into 'META-INF/licenses/rtest'
    }
}

// Distribute this archive alongside the mod JAR; a license notice alone is not source delivery.
tasks.register('correspondingSource', Zip) {
    archiveClassifier = 'corresponding-source'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        include 'src/**', 'native/**', 'scripts/**', 'third_party/**', 'gradle/**'
        include 'gradlew', 'gradlew.bat', '*.gradle', 'gradle.properties', 'LICENSE', 'README.md'
        include '*.bat', '*.ps1', 'docs/prime-atmosphere*.md'
        exclude '**/build/**', '**/.gradle/**', '**/__pycache__/**', '**/*.pyc'
    }
}
// Explicit source-rebuild gate. Reviewed exact outputs are packaged and verified separately.
tasks.register('compilePrimeAtmosphere', Exec) {
    def compiler = providers.gradleProperty('primeSlangCompiler').orElse('slangc')
    commandLine 'python3', file('scripts/compile_prime_atmosphere.py').absolutePath,
        '--slangc', compiler.get()
    inputs.files(fileTree('third_party/prime-atmosphere-26.3'))
    inputs.file('scripts/compile_prime_atmosphere.py')
    inputs.property('compiler', compiler)
    outputs.dir(layout.buildDirectory.dir('prime-atmosphere/locked'))
    // Always recheck the binary version: a changed compiler at the same path cannot reuse old outputs.
    outputs.upToDateWhen { false }
}
def verifyPrimeAtmosphereResources = tasks.register('verifyPrimeAtmosphereResources', Exec) {
    commandLine 'python3', file('scripts/verify_prime_atmosphere_resources.py').absolutePath
    inputs.files(fileTree('src/main/resources/prime/atmosphere/shaders'))
    inputs.files(fileTree('third_party/prime-atmosphere-26.3'))
    inputs.file('scripts/verify_prime_atmosphere_resources.py')
}
tasks.named('processResources') { dependsOn verifyPrimeAtmosphereResources }

// Model capture tests execute the same Minecraft classes used by the client.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

