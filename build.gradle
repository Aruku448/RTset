tasks.named('runClient') {
    doFirst {
        if (project.findProperty('graphics_backend')?.toString()?.equalsIgnoreCase('vulkan')) {
            def gameDir = file(project.findProperty('game_directory') ?: defaultGameDirectory)
            configureVulkanEarlyWindow(gameDir)
        }
    }
}

tasks.register('prepareVulkanInstance') {
    group = 'rtest'
    description = 'Disables NeoForge early OpenGL window creation for a Vulkan instance.'
    doLast {
        def gameDir = file(project.findProperty('game_directory') ?: defaultGameDirectory)
        configureVulkanEarlyWindow(gameDir)
        logger.lifecycle("Configured Vulkan window startup in ${new File(gameDir, 'config/fml.toml')}")
    }
}

tasks.register('installToInstance', Copy) {
    group = 'rtest'
    description = 'Copies the built mod JAR into the selected Minecraft instance mods directory.'
    dependsOn tasks.named('jar'), tasks.named('prepareVulkanInstance')
    from tasks.named('jar')
    into file(project.findProperty('instance_directory') ?: new File(defaultGameDirectory, 'mods'))
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

