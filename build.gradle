    dependsOn compiledSectionMeshCacheTest, rayTracingLightTreeTest, primeOfflineColorContractTest,
        rtActivationContractTest, particleRtGeometryContractTest
    dependsOn playerAnimationContractTest, playerBlasCommandTest, blockEntityModelContractTest,
        blockEntityRasterFallbackContractTest, entityRasterFallbackContractTest,
        itemModelGeometryAdapterTest, rayTracingShaderContractTest,
        nativeColorManagementTest, rayTracingPbrMaterialsTest, nrdNativeContractTest, nrdNativePlatformTest, nrdCompositeContractTest, nrdMotionContractTest, sceneWindowDeltaTest,
        sceneGeometryMergeContractTest, vulkanResourceLifecycleTest, rayTracingVisibilityPolicyTest,
        rayTracingFrameTimingContractTest, vanillaRenderControllerTest, sundialDenoiserContractTest
    failOnNoDiscoveredTests = false
    dependsOn fluidContractTest, dynamicContractTest, nativeEffectsContractTest, hdrPolicyContractTest, dynamicVulkanSliceContractTest, dynamicPlaceholderContractTest, dynamicTlasInstanceContractTest
}

tasks.named('runClient') {
    doFirst {
        if (project.findProperty('graphics_backend')?.toString()?.equalsIgnoreCase('vulkan')) {
            def gameDir = file(project.findProperty('game_directory') ?: defaultGameDirectory)
            def fmlConfig = new File(gameDir, 'config/fml.toml')
            fmlConfig.parentFile.mkdirs()
            def content = fmlConfig.exists() ? fmlConfig.getText('UTF-8') : ''
            if (content =~ /(?m)^earlyWindowControl\s*=/) {
                content = content.replaceFirst('(?m)^earlyWindowControl\s*=.*$', 'earlyWindowControl = false')
            } else {
                content += '\nearlyWindowControl = false\n'
            }
            fmlConfig.setText(content, 'UTF-8')
        }
    }
}

tasks.register('installToInstance', Copy) {
    group = 'rtest'
    description = 'Copies the built mod JAR into the selected Minecraft instance mods directory.'
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into file(project.findProperty('instance_directory') ?: new File(defaultGameDirectory, 'mods'))
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
